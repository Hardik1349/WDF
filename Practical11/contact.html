<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CampusConnect</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">🎓 CampusConnect</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="registration.html">Registration</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="events.html">Events</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="login-btn">Login</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="page-heading">
            <small>WE ARE HERE TO HELP</small>
            <h1>Contact Us</h1>
            <p>Send a message to the CampusConnect team.</p>
        </section>
        <section class="form-section">
            <form action="process_form.php" method="POST">
                <input type="hidden" name="formType" value="contact">
                <h2>Send Us a Message</h2>
                <label for="contactName">Full Name</label>
                <input type="text" id="contactName" name="name" maxlength="80" autocomplete="name" required>
                <label for="contactEmail">Email Address</label>
                <input type="email" id="contactEmail" name="email" maxlength="120" autocomplete="email" required>
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" maxlength="120" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" maxlength="2000" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer><div class="copyright">© 2026 CampusConnect. All rights reserved.</div></footer>
</body>
</html>
